<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111c22">
  <link rel="icon" href="data:,">
  <title>旋转塑形 · 刻削模拟器</title>
  <style>
:root {
  color-scheme: light;
  font-family: "Instrument Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  --paper: #eae8e0;
  --panel: #fbfaf5;
  --ink: #202b2d;
  --muted: #5d6a68;
  --border: #d8d9ce;
  --accent: #00765d;
  --dark: #101e23;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); min-width: 280px; }
main { max-width: 1480px; margin: auto; padding: 24px clamp(14px, 3vw, 43px) 16px; }
h1, h2, p { margin: 0; }
h1 { font-size: clamp(29px, 4vw, 50px); letter-spacing: -.06em; line-height: 1.08; }
h2 { font-size: 17px; letter-spacing: -.02em; }
.masthead { border-top: 3px solid var(--ink); padding: 17px 0 20px; }
.masthead p { color: var(--muted); font-size: 14px; margin-top: 9px; }
.workspace { display: grid; grid-template-columns: minmax(335px, .82fr) minmax(0, 1.5fr); gap: 14px; }
.editor { display: grid; gap: 12px; align-content: start; }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.section-head { display: flex; justify-content: space-between; align-items: center; min-height: 39px; gap: 8px; }
.trajectory, .settings { padding: 11px 15px 13px; }
.text-actions { display: flex; gap: 5px; }
button, input, select { font: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .5; cursor: default; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid #008a6c; outline-offset: 2px; }
.text-actions button { border: 0; background: transparent; color: var(--accent); padding: 7px; border-radius: 5px; font-size: 13px; }
.text-actions button:not(:disabled):hover { background: #e1ede5; }
.mode-switch { display: flex; gap: 5px; margin: 4px 0 9px; }
.mode-switch button { border: 1px solid var(--border); background: transparent; color: var(--ink); padding: 4px 11px; border-radius: 5px; font-size: 13px; }
.mode-switch button[aria-pressed="true"] { background: #e1ede5; color: var(--accent); border-color: #b2cdbd; font-weight: 600; }
.formula-fields { margin: 0 0 9px; font-size: 12px; }
.formula-fields select, .formula-fields input { background: #f4f4ed; border: 1px solid var(--border); border-radius: 5px; min-width: 0; padding: 6px; }
.formula-row { display: grid; grid-template-columns: auto minmax(0, 1.65fr) auto minmax(0, 1fr); align-items: center; gap: 5px; margin-top: 6px; }
.formula-row input { width: 100%; font-family: ui-monospace, monospace; }
.formula-error { color: #a03027; margin: 5px 0; }
#path.formula-chart { cursor: default; touch-action: pan-y; }
#path { display: block; width: 100%; height: clamp(243px, 32vh, 315px); border: 1px solid var(--border); border-radius: 7px; background: #f6f6ef; cursor: crosshair; touch-action: none; }
#path.formula-chart { height: clamp(214px, 26vh, 265px); }
.hint { font-size: 12px; color: var(--muted); line-height: 1.5; margin-top: 8px; min-height: 18px; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 13px; }
.fields label { display: grid; gap: 4px; font-size: 12px; min-width: 0; color: var(--muted); }
.fields input, .fields select { color: var(--ink); font-size: 14px; min-width: 0; }
.input-wrap, .fields select { width: 100%; min-height: 38px; background: #f4f4ed; border: 1px solid var(--border); border-radius: 6px; }
.input-wrap { display: flex; align-items: center; gap: 2px; }
.input-wrap input { width: 100%; border: 0; background: transparent; min-height: 36px; padding: 0 8px; font-variant-numeric: tabular-nums; }
.input-wrap > span { padding: 0 8px 0 3px; white-space: nowrap; }
.fields select { padding: 0 7px; }
.settings-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; padding-top: 9px; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; }
.settings-foot strong { color: var(--accent); font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.preview { position: relative; background: var(--dark); color: #f2f6ef; border-color: #273b42; display: flex; flex-direction: column; min-width: 0; }
.preview-head { display: flex; justify-content: space-between; align-items: center; padding: 15px 18px 0; gap: 8px; z-index: 1; }
.state { display: inline-flex; align-items: center; gap: 7px; color: #b5dbcc; font-size: 12px; white-space: nowrap; }
.state::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #82d9ab; }
#viewport { flex: 1; position: relative; min-height: 411px; overflow: hidden; }
#viewport canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#viewport canvas:active { cursor: grabbing; }
#webgl-error { padding: 24px; color: #f0d5b5; }
.view-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; color: #a9bcbc; font-size: 12px; padding: 2px 18px 12px; }
.view-controls button, .secondary { border: 1px solid #406063; border-radius: 6px; background: transparent; color: #e0f1e8; padding: 6px 10px; }
.view-controls button:not(:disabled):hover, .secondary:not(:disabled):hover { background: #253f40; }
.transport { border-top: 1px solid #324649; padding: 11px 18px 15px; }
.timeline { display: flex; align-items: center; gap: 12px; }
.timeline input { flex: 1; min-width: 0; accent-color: #a2f0c2; }
.timeline output { color: #c4d4d1; font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.transport-row { display: flex; align-items: center; gap: 9px; margin-top: 9px; flex-wrap: wrap; }
.primary, .secondary { min-height: 42px; padding: 0 13px; }
.primary { color: #102c23; background: #a0efc1; border: 0; border-radius: 6px; font-weight: 700; }
.primary:not(:disabled):hover { background: #c0f8d8; }
.contact { color: #bbd0c8; font-size: 12px; margin-left: auto; font-variant-numeric: tabular-nums; }
.footnote { margin-top: 12px; color: var(--muted); font-size: 12px; line-height: 1.55; }
.visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
@media (max-width: 760px) {
  .workspace { grid-template-columns: minmax(0, 1fr); }
  main { padding-top: 14px; }
  #viewport { min-height: 340px; }
  #path { height: 258px; }
}
@media (max-width: 359px) {
  .trajectory, .settings, .preview-head, .transport, .view-controls { padding-left: 11px; padding-right: 11px; }
  .contact { margin-left: 0; width: 100%; }
}
</style>
</head>
<body>
  <main>
    <header class="masthead">
      <div><h1>旋转塑形</h1><p>画出刀尖的路径，看锉刀如何刻削旋转中的坯体。</p></div>
    </header>

    <div class="workspace">
      <div class="editor">
        <section class="panel trajectory" aria-labelledby="trajectory-title">
          <div class="section-head"><h2 id="trajectory-title">光点轨迹</h2><div class="text-actions"><button id="example" type="button">弧线示例</button><button id="tunnel" type="button">穿孔示例</button><button id="clear" type="button">清空</button></div></div>
          <div class="mode-switch" role="group" aria-label="轨迹输入方式"><button id="draw-mode" type="button" aria-pressed="true">手绘</button><button id="formula-mode" type="button" aria-pressed="false">函数</button></div>
          <div class="formula-fields" id="formula-fields" hidden>
            <label for="preset">函数示例</label><select id="preset"><option value="arc">正弦弧线</option><option value="wave">波浪进退</option><option value="loop">椭圆回环</option><option value="tunnel">水平穿孔</option><option value="">自定义</option></select>
            <div class="formula-row"><label for="formula-x">x(t)</label><input id="formula-x" type="text" value="80-46*sin(pi*t)^2" spellcheck="false"><label for="formula-y">y(t)</label><input id="formula-y" type="text" value="6+108*t" spellcheck="false"></div>
            <p class="hint">t 从 0 到 1，对应所设时间。支持 sin、cos、sqrt、abs、pi；乘法写成 *。</p>
            <p class="formula-error" id="formula-error" role="status" hidden></p>
          </div>
          <canvas id="path" aria-label="光点轨迹画板，横向为左右位置，纵向为高度" role="img"></canvas>
          <p class="hint" id="path-hint">按住画板画一笔。中线是旋转轴，画过中线可到达坯体另一侧。</p>
        </section>
        <section class="panel settings" aria-labelledby="settings-title">
          <div class="section-head"><h2 id="settings-title">运动设置</h2></div>
          <div class="fields">
            <label for="duration">运动时间<span class="input-wrap"><input id="duration" type="number" min="0.5" max="120" step="any" value="11"><span>秒</span></span></label>
            <label for="rpm">转盘转速<span class="input-wrap"><input id="rpm" type="number" min="0" max="120" step="any" value="4.09"><span>转/分</span></span></label>
            <label for="direction">转盘方向<select id="direction"><option value="1">俯视逆时针</option><option value="-1">俯视顺时针</option></select></label>
            <label for="width">刻削直径<span class="input-wrap"><input id="width" type="number" min="4" max="60" step="any" value="24"><span>毫米</span></span></label>
          </div>
          <div class="settings-foot"><span>光点走完时，转盘转过</span><strong id="turns">0.75 圈</strong></div>
        </section>
      </div>

      <section class="panel preview" aria-labelledby="preview-title">
        <div class="preview-head"><h2 id="preview-title">三维刻削预览</h2><span class="state" id="state" role="status">待播放</span></div>
        <div id="viewport"><p id="webgl-error" hidden>三维预览需要支持 WebGL 2 的浏览器。</p></div>
        <div class="view-controls"><button id="reset-view" type="button">侧面视角</button><button id="tool-view" type="button">沿光点方向看</button><span>拖动查看各面 · 滚动缩放</span></div>
        <div class="transport">
          <div class="timeline">
            <label class="visually-hidden" for="seek">模拟进度</label>
            <input id="seek" type="range" min="0" max="1000" value="0">
            <output id="time">0.00 / 11.00 秒</output>
          </div>
          <div class="transport-row"><button class="primary" id="play" type="button">开始刻削</button><button class="secondary" id="reset" type="button">重置坯体</button><span id="contact" class="contact"></span></div>
        </div>
      </section>
    </div>
    <p class="footnote">光点是刀尖。锉刀从图中右侧进刀，刀身到刀尖扫过的材料会被移除，脱离底座的部分会掉落。坯体高 120 mm、半径 60 mm。</p>
  </main>
